<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="1160" height="520" role="img" aria-label="Pixie Patrol Full-Roster 2D Painted Art and Skeletal Rig Progress Dashboard: 82 of 152 units painted across 6 custom Godot 4 rigs">
