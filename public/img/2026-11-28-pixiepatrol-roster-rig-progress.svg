  <text x="54" y="463" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="12" font-weight="700">ZERO-CODE WAVE 2 READY  •  PAUSED ONLY BY HTTP 429 RESOURCE_EXHAUSTED</text>
  <text x="54" y="483" fill="#d6d3d1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">SpriteArt.gd auto-discovers new PNG cutouts and binds them to pre-wired rigs/shaders automatically — remaining 70 units run cleanly on procedural fallbacks.</text>
