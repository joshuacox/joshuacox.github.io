<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" width="1120" height="490" role="img" aria-label="PixiePatrol Hybrid 2D Animation Pipeline: 12-Bone Quadruped Sprite Rig and Custom 2D Deformation Shaders">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1412"/>
      <stop offset="55%" stop-color="#111f1b"/>
      <stop offset="100%" stop-color="#0d1324"/>
    </linearGradient>
    <linearGradient id="foxGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="490" rx="16" fill="url(#bg3)" stroke="#233b32" stroke-width="2"/>

  <!-- Header -->
  <text x="36" y="42" fill="#fef3c7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700">PIXIE PATROL: "NO 3D NEEDED" HYBRID 2D ANIMATION PIPELINE</text>
  <text x="36" y="65" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Arthur Rackham Sepia Ink × Brian Froud/Amy Brown Jewel Tones  •  Animated Directly in Godot 4 2D (39/39 Headless Scenes Green)</text>

  <!-- CARD 1: 12-BONE QUADRUPED RIG -->
  <rect x="36" y="88" width="440" height="368" rx="12" fill="#0f1d19" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="54" y="116" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="13" font-weight="700">1. RED FOX: 12-BONE SKINNED POLYGON2D</text>
  <text x="54" y="135" fill="#cbd5e1" font-family="ui-sans-serif, sans-serif" font-size="11.5">QuadrupedSpriteRig.gd + painted_unit_rim.gdshader</text>

  <!-- Stylized Fox Kinematic Skeleton Diagram -->
  <rect x="54" y="150" width="404" height="170" rx="8" fill="#08110e" stroke="#2d4a3e"/>
  <!-- Grid overlay symbolizing 32x24 Polygon2D mesh -->
  <g stroke="#1e3a2f" stroke-width="0.8" opacity="0.7">
    <line x1="80" y1="150" x2="80" y2="320"/>
    <line x1="120" y1="150" x2="120" y2="320"/>
    <line x1="160" y1="150" x2="160" y2="320"/>
    <line x1="200" y1="150" x2="200" y2="320"/>
    <line x1="240" y1="150" x2="240" y2="320"/>
    <line x1="280" y1="150" x2="280" y2="320"/>
    <line x1="320" y1="150" x2="320" y2="320"/>
    <line x1="360" y1="150" x2="360" y2="320"/>
    <line x1="400" y1="150" x2="400" y2="320"/>
    <line x1="54" y1="185" x2="458" y2="185"/>
    <line x1="54" y1="220" x2="458" y2="220"/>
    <line x1="54" y1="255" x2="458" y2="255"/>
    <line x1="54" y1="290" x2="458" y2="290"/>
  </g>

  <!-- Split-row dashed line (zero webbing!) -->
  <line x1="66" y1="255" x2="446" y2="255" stroke="#34d399" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="442" y="249" fill="#34d399" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="end">split_rows (zero leg webbing)</text>

  <!-- 12-bone skeleton lines -->
  <g stroke="url(#foxGlow)" stroke-width="4" stroke-linecap="round">
    <!-- tail_tip <- tail_base <- torso -> head -->
    <line x1="102" y1="188" x2="152" y2="218"/>
    <line x1="152" y1="218" x2="225" y2="224"/>
    <line x1="225" y1="224" x2="318" y2="218"/>
    <line x1="318" y1="218" x2="368" y2="184"/>
    <!-- Back Left leg (upper + lower) -->
    <line x1="185" y1="224" x2="164" y2="266"/>
    <line x1="164" y1="266" x2="146" y2="302"/>
    <!-- Back Right leg -->
    <line x1="212" y1="225" x2="218" y2="266"/>
    <line x1="218" y1="266" x2="234" y2="300"/>
    <!-- Front Left leg -->
    <line x1="296" y1="220" x2="282" y2="266"/>
    <line x1="282" y1="266" x2="274" y2="304"/>
    <!-- Front Right leg -->
    <line x1="322" y1="220" x2="346" y2="262"/>
    <line x1="346" y1="262" x2="376" y2="292"/>
  </g>

  <!-- Joint circles -->
  <g fill="#fef08a" stroke="#b45309" stroke-width="2">
    <circle cx="102" cy="188" r="5"/>
    <circle cx="152" cy="218" r="5.5"/>
    <circle cx="225" cy="224" r="7"/>
    <circle cx="318" cy="218" r="6"/>
    <circle cx="368" cy="184" r="6"/>
    <circle cx="164" cy="266" r="4.5"/>
    <circle cx="146" cy="302" r="4"/>
    <circle cx="218" cy="266" r="4.5"/>
    <circle cx="234" cy="300" r="4"/>
    <circle cx="282" cy="266" r="4.5"/>
    <circle cx="274" cy="304" r="4"/>
    <circle cx="346" cy="262" r="4.5"/>
    <circle cx="376" cy="292" r="4"/>
  </g>

  <!-- Labels on skeleton -->
  <g font-family="ui-monospace, monospace" font-size="10" fill="#fde68a">
    <text x="82" y="176">tail_tip</text>
    <text x="128" y="206">tail_base</text>
    <text x="234" y="212">torso (root)</text>
    <text x="378" y="186">head</text>
    <text x="72" y="308" fill="#94a3b8">32×24 mesh</text>
    <text x="330" y="312" fill="#fb923c">4× (upper+lower)</text>
  </g>

  <!-- Bullet Specs -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
    <text x="54" y="346">• Diagonal trot gait + knee/elbow flex + spine bounce</text>
    <text x="54" y="366">• Split leg vertex pools (rows 16/18) prevent tearing</text>
    <text x="54" y="386">• Behavior poses: <tspan fill="#fbbf24" font-family="ui-monospace, monospace">howl, sniff, lunge, shake</tspan></text>
    <text x="54" y="406">• Night contour rim lighting + freeze-stop + hit-flash</text>
    <text x="54" y="434" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">12 BONES  •  ZERO 3D MODELS  •  ZERO WEBBING</text>
  </g>

  <!-- CARD 2: PIXIE SCOUT TOWER SHADER -->
  <rect x="498" y="88" width="286" height="368" rx="12" fill="#0f1d19" stroke="#34d399" stroke-width="1.6"/>
  <text x="516" y="116" fill="#34d399" font-family="ui-monospace, monospace" font-size="13" font-weight="700">2. TOWER DEFORMATION</text>
  <text x="516" y="135" fill="#cbd5e1" font-family="ui-sans-serif, sans-serif" font-size="11.5">tower_sway.gdshader</text>

  <!-- UV Zone Visual -->
  <rect x="516" y="150" width="250" height="170" rx="8" fill="#08110e" stroke="#2d4a3e"/>
  <!-- Upper canopy sway zone -->
  <rect x="528" y="160" width="226" height="68" rx="6" fill="#064e3b" opacity="0.65" stroke="#34d399" stroke-dasharray="4 3"/>
  <text x="641" y="182" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">UV.y &lt; 0.70 : CANOPY &amp; ARCHER</text>
  <text x="641" y="200" fill="#cbd5e1" font-family="ui-sans-serif, sans-serif" font-size="10.5" text-anchor="middle">← wind_sway.x + wing flutter →</text>
  <text x="641" y="216" fill="#c084fc" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">bioluminescent mushroom pulse</text>

  <!-- Bow recoil band -->
  <rect x="528" y="233" width="226" height="30" rx="5" fill="#312e81" opacity="0.7" stroke="#818cf8"/>
  <text x="641" y="252" fill="#c7d2fe" font-family="ui-monospace, monospace" font-size="10.5" text-anchor="middle">charge_progress + recoil_squash</text>

  <!-- Anchored roots zone -->
  <rect x="528" y="268" width="226" height="42" rx="6" fill="#1c1917" stroke="#78716c"/>
  <text x="641" y="287" fill="#d6d3d1" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">UV.y ≥ 0.70 : ROOTED TRUNK</text>
  <text x="641" y="302" fill="#a8a29e" font-family="ui-sans-serif, sans-serif" font-size="10" text-anchor="middle">0.0 displacement (pinned to soil)</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
    <text x="516" y="346">• Mounted as Sprite2D underlay</text>
    <text x="516" y="366">• Keeps gnarled roots locked tight</text>
    <text x="516" y="386">• Balcony archer draws &amp; recoils bow</text>
    <text x="516" y="406">• Night moonlight rim via SpriteArt</text>
    <text x="516" y="434" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">1 PAINTING  •  FULL WIND &amp; RECOIL</text>
  </g>

  <!-- CARD 3: SYLVAN WARDEN AVATAR SHADER -->
  <rect x="806" y="88" width="278" height="368" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="1.6"/>
  <text x="824" y="116" fill="#e879f9" font-family="ui-monospace, monospace" font-size="13" font-weight="700">3. AVATAR WING-BEAT</text>
  <text x="824" y="135" fill="#cbd5e1" font-family="ui-sans-serif, sans-serif" font-size="11.5">avatar_flutter.gdshader</text>

  <!-- Avatar Shader Visual -->
  <rect x="824" y="150" width="242" height="170" rx="8" fill="#090d1a" stroke="#3b2f63"/>
  <!-- Left & Right Wing Lobes -->
  <ellipse cx="892" cy="204" rx="44" ry="24" transform="rotate(-24 892 204)" fill="#3b0764" stroke="#e879f9" stroke-width="1.5"/>
  <ellipse cx="998" cy="204" rx="44" ry="24" transform="rotate(24 998 204)" fill="#3b0764" stroke="#e879f9" stroke-width="1.5"/>
  <text x="892" y="208" fill="#f5d0fe" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">L-WING</text>
  <text x="998" y="208" fill="#f5d0fe" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">R-WING</text>
  <!-- Center torso + skirt drag -->
  <circle cx="945" cy="196" r="14" fill="#10b981" stroke="#a7f3d0" stroke-width="1.5"/>
  <path d="M 935 212 L 955 212 L 968 278 Q 945 288 922 278 Z" fill="#059669" opacity="0.8" stroke="#6ee7b7"/>
  <text x="945" y="255" fill="#ecfdf5" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">cloak_lag</text>
  <text x="945" y="305" fill="#c084fc" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">show_behind_parent layering</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
    <text x="824" y="346">• Independent L/R wing_flap lobes</text>
    <text x="824" y="366">• Flight-velocity petal skirt lag</text>
    <text x="824" y="386">• Smooth halo + zero night washout</text>
    <text x="824" y="406">• Spells &amp; motes layer cleanly on top</text>
    <text x="824" y="434" fill="#e879f9" font-family="ui-monospace, monospace" font-size="11" font-weight="700">CRISP WINGS  •  DAY &amp; STARLIGHT</text>
  </g>
</svg>
